<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15" />

  <!-- Cap and Bridge Graphic -->
  <g filter="url(#shadow)" transform="translate(64, 74) scale(0.75)">
    <!-- Graduation Cap Roof -->
    <path d="M256 60 L40 180 L256 300 L472 180 Z" fill="#ffffff" />
    <!-- Tassel / Base -->
    <path d="M120 230 L120 340 C120 400, 392 400, 392 340 L392 230 L256 310 Z" fill="#e0e7ff" />
    <!-- Bridge Arches -->
    <path d="M80 440 C140 370, 210 370, 256 440 C302 370, 372 370, 432 440" fill="none" stroke="#34d399" stroke-width="28" stroke-linecap="round" />
  </g>
</svg>
